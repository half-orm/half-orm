name: Documentation

on:
  push:
    branches: [ main, 'release/*', 'dev/*', 'doc' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  # Manual trigger — three ways to invoke:
  #
  # 1. GitHub UI: Actions → Documentation → Run workflow
  #
  # 2. GitHub CLI:
  #      gh workflow run docs.yml -f version=dev                                         # rebuild dev (main)
  #      gh workflow run docs.yml -f version=0.18 -f alias=latest                       # rebuild 0.18 as latest
  #      gh workflow run docs.yml --ref 0.17 -f version=0.17                            # rebuild 0.17 (maintenance branch)
  #      gh workflow run docs.yml -f cleanup=true                                        # cleanup only
  #      gh workflow run docs.yml --ref 0.17 -f version=0.17 -f cleanup=true
  #
  # 3. REST API:
  #      # From main:
  #      curl -X POST \
  #        -H "Authorization: Bearer $GITHUB_TOKEN" \
  #        https://api.github.com/repos/half-orm/half-orm/actions/workflows/docs.yml/dispatches \
  #        -d '{"ref":"main","inputs":{"version":"0.18","cleanup":"true"}}'
  #      # From maintenance branch:
  #      curl -X POST \
  #        -H "Authorization: Bearer $GITHUB_TOKEN" \
  #        https://api.github.com/repos/half-orm/half-orm/actions/workflows/docs.yml/dispatches \
  #        -d '{"ref":"0.17","inputs":{"version":"0.17","cleanup":"true"}}'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rebuild (e.g. "0.18", "dev"). Leave empty to skip rebuild.'
        required: false
        # Empty, so a half-filled form does nothing. It used to default to
        # `dev`, which meant filling in only `alias: latest` -- meaning "point
        # latest at the release" -- published `dev` and moved the alias onto
        # it. Naming the version is now deliberate, in every invocation.
        default: ''
      alias:
        description: 'Alias to set on the rebuilt version (e.g. "latest"). Leave empty for none.'
        required: false
        default: ''
      title:
        description: 'Display title for the version (e.g. "0.18.10 (latest)"). Leave empty to auto-generate.'
        required: false
        default: ''
      cleanup:
        description: 'Delete published versions absent from KEPT_VERSIONS in docs-impl.yml'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  docs:
    # The steps live in docs-impl.yml on main, so fixing them once fixes every
    # branch. Only the triggers and the dispatch inputs belong here, because
    # GitHub reads those from the ref you dispatch against.
    uses: half-orm/half-orm/.github/workflows/docs-impl.yml@main
    with:
      version: ${{ inputs.version }}
      alias:   ${{ inputs.alias }}
      title:   ${{ inputs.title }}
      cleanup: ${{ inputs.cleanup }}
      # main's documentation builds clean; the maintenance lines carry defects
      # fixed only here, so they pass strict: 'false'.
      strict:  'true'
    secrets: inherit
