name: Documentation

on:
  push:
    branches: [ main, 'release/*', 'dev/*', 'doc' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  # Manual trigger — three ways to invoke:
  #
  # 1. GitHub UI: Actions → Documentation → Run workflow
  #
  # 2. GitHub CLI:
  #      gh workflow run docs.yml                                                        # rebuild dev (main)
  #      gh workflow run docs.yml -f version=0.18 -f alias=latest                       # rebuild 0.18 as latest
  #      gh workflow run docs.yml --ref 0.17 -f version=0.17                            # rebuild 0.17 (maintenance branch)
  #      gh workflow run docs.yml -f cleanup=true -f version=''                         # cleanup only
  #      gh workflow run docs.yml --ref 0.17 -f version=0.17 -f cleanup=true
  #
  # 3. REST API:
  #      # From main:
  #      curl -X POST \
  #        -H "Authorization: Bearer $GITHUB_TOKEN" \
  #        https://api.github.com/repos/half-orm/half-orm/actions/workflows/docs.yml/dispatches \
  #        -d '{"ref":"main","inputs":{"version":"0.18","cleanup":"true"}}'
  #      # From maintenance branch:
  #      curl -X POST \
  #        -H "Authorization: Bearer $GITHUB_TOKEN" \
  #        https://api.github.com/repos/half-orm/half-orm/actions/workflows/docs.yml/dispatches \
  #        -d '{"ref":"0.17","inputs":{"version":"0.17","cleanup":"true"}}'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rebuild (e.g. "0.18", "dev"). Leave empty to skip rebuild.'
        required: false
        default: 'dev'
      alias:
        description: 'Alias to set on the rebuilt version (e.g. "latest"). Leave empty for none.'
        required: false
        default: ''
      title:
        description: 'Display title for the version (e.g. "0.18.10 (latest)"). Leave empty to auto-generate.'
        required: false
        default: ''
      cleanup:
        description: 'Delete versions not in the kept list (0.17, 0.18, dev)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
          
      - name: Install dependencies
        run: |
          pip install \
            mkdocs-material \
            mkdocstrings-python \
            mkdocs-git-revision-date-localized-plugin \
            mike \
            griffe-sphinx
            
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
      - name: Get version info
        id: version
        env:
          # An expression is substituted into the script *text* before bash
          # ever sees it, so a workflow_dispatch input written inside `run:`
          # is code, not data: `0.18"; curl … | sh; #` runs as this job, which
          # holds contents: write on the repository. Read from the
          # environment, the same value stays a string.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_ALIAS: ${{ github.event.inputs.alias }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -eu

          # A newline in a value would let it append lines of its own to
          # $GITHUB_OUTPUT, and so declare step outputs nobody wrote here.
          emit() {
            case "$2" in
              *$'\n'*|*$'\r'*)
                echo "::error::$1 must be a single line"; exit 1 ;;
            esac
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          # version and alias end up as arguments to `mike deploy`. Quoting
          # stops them being read as commands; this stops them being read as
          # options, and keeps them to what a version name can hold.
          check_name() {
            case "$2" in
              '') return 0 ;;
              -*) echo "::error::$1 must not start with '-'"; exit 1 ;;
              *[!A-Za-z0-9._-]*)
                echo "::error::$1 may only contain A-Z a-z 0-9 . _ -"; exit 1 ;;
            esac
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            V="$INPUT_VERSION"
            A="$INPUT_ALIAS"
            T="$INPUT_TITLE"
            check_name version "$V"
            check_name alias "$A"
            emit version "$V"
            emit alias "$A"
            emit title "${T:-${V} (rebuild)}"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            VERSION_NUMBER="${VERSION#v}"
            MINOR="${VERSION_NUMBER%.*}"
            # Git allows ';' and '$' in a tag name, and this one reaches a
            # command line further down.
            check_name version "$MINOR"
            emit version "$MINOR"
            emit alias latest
            emit title "${VERSION_NUMBER} (latest)"
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            emit version dev
            emit alias ''
            emit title Development
          elif [[ $GITHUB_REF == refs/heads/release/* ]]; then
            VERSION="${GITHUB_REF_NAME#release/}"
            check_name version "${VERSION}-rc"
            emit version "${VERSION}-rc"
            emit alias ''
            emit title "${VERSION} (release candidate)"
          elif [[ $GITHUB_REF == refs/heads/dev/* ]]; then
            VERSION="${GITHUB_REF_NAME#dev/}"
            check_name version "${VERSION}-dev"
            emit version "${VERSION}-dev"
            emit alias ''
            emit title "${VERSION} (development)"
          elif [[ $GITHUB_REF == refs/heads/doc ]]; then
            emit version dev
            emit alias ''
            emit title Development
          else
            emit version ''
            emit alias ''
            emit title ''
          fi
          
      - name: Cleanup stale versions
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.cleanup == 'true') ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: |
          # Exhaustive list of minor versions to keep in the doc menu.
          # Update this list when a new minor is released or a branch is EOL.
          KEPT_VERSIONS="0.17 0.18 dev"

          EXISTING=$(mike list --json | python3 -c "import sys,json; [print(e['version']) for e in json.load(sys.stdin)]" || true)
          for v in $EXISTING; do
            keep=false
            for k in $KEPT_VERSIONS latest; do
              [[ "$v" == "$k" ]] && keep=true && break
            done
            if [[ "$keep" == "false" ]]; then
              echo "Deleting stale version: $v"
              mike delete --push "$v"
            fi
          done
          echo "=== Versions after cleanup ==="
          mike list

      - name: Fetch latest gh-pages
        run: |
          git fetch origin gh-pages:gh-pages

      # `mike deploy` builds the site itself and takes no --strict, so the
      # check runs here instead: on every trigger, and before anything is
      # pushed to gh-pages. The PR-preview step below only covers pull
      # requests, and work lands on main directly.
      - name: Validate documentation
        run: mkdocs build --strict --config-file mkdocs.yml --site-dir /tmp/docs-validation

      - name: Build and deploy documentation
        if: steps.version.outputs.version != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          # Derived from the inputs above, so carried the same way. They were
          # also unquoted here, which left them open to word splitting.
          DOC_VERSION: ${{ steps.version.outputs.version }}
          DOC_ALIAS: ${{ steps.version.outputs.alias }}
          DOC_TITLE: ${{ steps.version.outputs.title }}
        run: |
          # Deploy the version
          if [[ -n "$DOC_ALIAS" ]]; then
            mike deploy \
              --push \
              --update-aliases \
              "$DOC_VERSION" \
              "$DOC_ALIAS" \
              --title "$DOC_TITLE"
          else
            mike deploy \
              --push \
              "$DOC_VERSION" \
              --title "$DOC_TITLE"
          fi

          # Set default version if this is latest
          if [[ "$DOC_ALIAS" == "latest" ]]; then
            mike set-default --push latest
          fi

          # For dev version, set as default if no other default exists
          if [[ "$DOC_VERSION" == "dev" ]]; then
            # Check if any default exists
            if ! mike list | grep -q "\[default\]"; then
              mike set-default --push dev
            fi
          fi

          # List versions for debugging
          echo "=== Deployed versions ==="
          mike list
          
      - name: Build for PR preview
        if: github.event_name == 'pull_request'
        run: |
          mkdocs build --strict --config-file mkdocs.yml
          
      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: site/