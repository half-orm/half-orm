site_name: halfORM Documentation
site_description: A simple PostgreSQL to Python mapper
site_author: half-orm
# The project site is served under /half-orm/; mike then deploys each release
# line into a directory of its own beneath it. Without the repository segment
# every page declared a canonical on the organisation root, which is a
# different site and may not exist at all.
site_url: https://half-orm.github.io/half-orm/
repo_url: https://github.com/half-orm/half-orm
repo_name: half-orm/half-orm

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
  icon:
    repo: fontawesome/brands/github

# docs/README.md documents how this site is built; it is not a page of it,
# and mkdocs would otherwise drop it with a warning for clashing with index.md.
exclude_docs: |
  README.md
  # Describes a development process that is not the one in use. Hidden rather
  # than deleted: it is wrong, not worthless, and a wrong process left
  # searchable is worse than one that is absent.
  guides/development/development-workflow.md

# Advisory pages are reached from the security index, not from the menu, which
# would otherwise gain an entry per advisory for ever. They are listed here so
# they stop being reported as pages missing from the nav: that report is worth
# reading only while it holds pages nobody meant to leave out.
not_in_nav: |
  security-*.md

hooks:
  - hooks/security_notice.py
  - hooks/breaking_changes.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            extensions:
              - griffe_sphinx
            docstring_style: google
            docstring_options:
              # Silences griffe's "No type or annotation for ..." notes, and
              # only those. They report signatures without annotations, not
              # documentation defects -- the docstrings already state the
              # types, and the rendered pages show them. Left on, they would
              # be the only thing standing between this build and --strict,
              # which is what actually catches dead links.
              warn_missing_types: false
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: date

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: half-orm
      repo: half-orm
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  # Set by the docs workflow, which already knows which version it is
  # publishing. The outdated banner needs it: Material shows that banner
  # whenever the page is not the one aliased `latest`, and `dev` is not, so
  # without this the development documentation was announced as an old
  # release no longer receiving fixes.
  doc_version: !ENV [DOC_VERSION, '']
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/half-orm/half-orm
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/half-orm/

nav:
  - Home: index.md
  - Learn in half an hour: half-an-hour.md
  # An argument, not reference material: why the design refuses what it refuses.
  # Listed after the tutorial because it answers "why is it like this?", which is
  # a question the reader has only once they have seen it work. Named for the
  # thesis rather than the genre: every other tab answers a question the reader
  # arrives with, and "Essays" named only the shape of the prose. The home page
  # opens on "a database-first ORM for PostgreSQL", so the tab picks up a term
  # the reader has already met and promises its justification.
  - Why database-first:
    - essays/index.md
    - The Vietnam of Computer Science, Twenty Years On: essays/vietnam-twenty-years-on.md
    - A Relation Is a Predicate, Not an Object: essays/relation-as-predicate.md
    - You Can't Have an N+1 Problem if Navigation Isn't a Query: essays/navigation-is-a-join.md
    - Delete Your Repository Layer: essays/predicate-locality.md
    - halfORM vs SQLAlchemy Core vs Django ORM: essays/comparison.md
    - Git Is the Migration Tool: essays/git-is-the-migration-tool.md
  - API Reference:
    - Model: api/model.md
    - Relation: api/relation.md
    - Field: api/field.md
    - FKey: api/fkey.md
    - Transaction: api/transaction.md
    - Testing: api/testing.md
  - Extensions:
    - extensions/index.md
  - Breaking changes: breaking-changes.md
  - Security:
    - Advisories: security.md
    - What halfORM defends: security-model.md
  - Development Guides:
    - Extension Development: guides/development/extension-development.md
    - Documentation Workflow: guides/development/documentation-workflow.md
extra_css:
  - assets/css/custom.css